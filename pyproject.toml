[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verticalparts-supabase-mcp"
version = "0.1.0"
description = "MCP corporativo de administração do Supabase da VerticalParts"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.scripts]
verticalparts-supabase-mcp = "verticalparts_supabase_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/verticalparts_supabase_mcp"]
