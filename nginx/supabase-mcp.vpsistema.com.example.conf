server {
    server_name supabase-mcp.vpsistema.com;

    location /mcp {
        if ($http_x_api_key != "SUBSTITUA_PELA_CHAVE_REAL_NUNCA_COMMITAR") { return 401; }

        proxy_pass http://127.0.0.1:8022/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8022;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/supabase-mcp.vpsistema.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/supabase-mcp.vpsistema.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = supabase-mcp.vpsistema.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name supabase-mcp.vpsistema.com;
    return 404; # managed by Certbot
}
